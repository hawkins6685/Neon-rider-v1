<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider | GitHub Pages</title>
    
    <!-- Dependencies (HTTPS) -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { margin: 0; padding: 0; overflow: hidden; background-color: #050505; font-family: 'Inter', sans-serif; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .hud-text { text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        
        #boot-screen {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease-out;
        }
        .loader-bar { width: 200px; height: 2px; background: rgba(0, 242, 255, 0.1); margin-top: 20px; overflow: hidden; position: relative; }
        .loader-progress { position: absolute; left: 0; top: 0; height: 100%; background: #00f2ff; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div id="boot-screen">
        <div class="text-cyan-400 font-black tracking-[0.3em] text-xs animate-pulse">BOOTING SYSTEM...</div>
        <div class="loader-bar"><div id="loader-fill" class="loader-progress"></div></div>
        <div id="status-log" class="mt-4 text-[10px] text-white/40 font-mono text-center">Initializing Scripts...</div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        console.log("🚀 Script Initialization Started");
        const statusLog = document.getElementById('status-log');
        const updateStatus = (msg) => { if(statusLog) statusLog.innerText = msg; console.log("System:", msg); };

        // Global Variable Fix for CDN Framer Motion
        const Motion = window.Motion || window.FramerMotion;
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = Motion || { 
            motion: { div: (p) => <div {...p}>{p.children}</div>, button: (p) => <button {...p}>{p.children}</div> },
            AnimatePresence: (p) => p.children 
        };

        // --- PHASER GAME LOGIC ---
        class MainScene extends Phaser.Scene {
            constructor(callbacks) {
                super('MainScene');
                this.updateScoreCallback = callbacks.onUpdateScore;
                this.updateSpeedCallback = callbacks.onUpdateSpeed;
                this.gameOverCallback = callbacks.onGameOver;
                
                this.player = null;
                this.score = 0;
                this.isGameOver = true;
                this.speed = 400;
                this.currentLane = 1;
                this.bikeColor = 0x00f2ff;
                this.isInvincible = false;
                this.assetStatus = {};
            }

            preload() {
                updateStatus("🎮 Preloading Assets...");
                const fill = document.getElementById('loader-fill');
                this.load.on('progress', (v) => { if(fill) fill.style.width = (v * 100) + '%'; });
                
                // Track assets
                const assets = [
                    { key: 'bike', url: 'hv0ZQZtc/motorcycle-black.png' },
                    { key: 'car', url: 'tJrGP4B3/car-green-2.png' },
                    { key: 'truck', url: '2jH5nkb7/car-red-small-4.png' },
                    { key: 'cone', url: 'BvV0X6wv/cone-straight.png' },
                    { key: 'barrel', url: 'gjb1Z6yN/barrel-red-down.png' }
                ];

                this.load.on('filecomplete', (key) => {
                    this.assetStatus[key] = true;
                    console.log(`✅ Asset Loaded: ${key}`);
                });

                this.load.on('loaderror', (file) => {
                    this.assetStatus[file.key] = false;
                    console.log('Failed to load:', file.key);
                    updateStatus(`Warning: ${file.key} failed, using placeholder.`);
                });

                this.load.on('complete', () => {
                    console.log('All assets loaded or failed');
                });

                // EMERGENCY TIMEOUT: Force game to start after 4 seconds
                this.time.delayedCall(4000, () => {
                    if (this.load.isLoading) {
                        console.warn("⏰ Preload Timeout! Forcing boot...");
                        this.scene.start('MainScene'); 
                    }
                });

                const BASE = "https://i.postimg.cc";
                assets.forEach(a => this.load.image(a.key, `${BASE}/${a.url}`));

                // Build fallback textures
                const graphics = this.make.graphics({ x: 0, y: 0 });
                
                // Bike fallback (Cyan triangle)
                graphics.clear().fillStyle(0x00f2ff).fillTriangle(0, 0, 40, 20, 0, 40);
                graphics.generateTexture('bike_fallback', 40, 40);
                
                // Car fallback (Red box)
                graphics.clear().fillStyle(0xff0000).fillRect(0, 0, 60, 100);
                graphics.generateTexture('car_fallback', 60, 100);

                // Trail particle
                graphics.clear().fillStyle(0xffffff).fillCircle(4, 4, 4);
                graphics.generateTexture('trail', 8, 8);
                
                graphics.destroy();
            }

            create() {
                updateStatus("✅ Game Engine Ready");
                const boot = document.getElementById('boot-screen');
                if(boot) { boot.style.opacity = '0'; setTimeout(() => boot.remove(), 600); }

                const { width, height } = this.scale;
                this.gameWidth = width;
                this.gameHeight = height;
                this.laneWidth = width / 3;

                console.log(`📐 Dimensions: ${width}x${height}, Lane: ${this.laneWidth}`);

                // Background & Road
                this.add.rectangle(width/2, height/2, width, height, 0x050505);
                
                // Road perspective
                this.roadGraphics = this.add.graphics();
                this.drawRoad();

                this.roadLines = this.add.group();
                for (let i = 0; i < 12; i++) {
                    const lineY = i * (height / 6);
                    const l1 = this.add.rectangle(this.laneWidth, lineY, 4, 60, 0x00ffff, 0.3);
                    const l2 = this.add.rectangle(this.laneWidth * 2, lineY, 4, 60, 0x00ffff, 0.3);
                    this.roadLines.add(l1);
                    this.roadLines.add(l2);
                }

                // Player creation with fallback check
                const startX = this.getLaneX(this.currentLane);
                const startY = height - 120;
                
                const playerKey = this.assetStatus['bike'] ? 'bike' : 'bike_fallback';
                this.player = this.add.sprite(startX, startY, playerKey);
                
                // Intelligent scaling
                if (playerKey === 'bike') {
                    const targetWidth = this.laneWidth * 0.5;
                    this.player.setScale(targetWidth / this.player.width);
                } else {
                    this.player.setAngle(-90); // Point fallback triangle up
                }
                
                this.player.setTint(this.bikeColor);
                this.physics.add.existing(this.player);

                this.obstacles = this.physics.add.group();
                this.physics.add.overlap(this.player, this.obstacles, this.handleCollision, undefined, this);

                // Controls
                this.input.keyboard.on('keydown-LEFT', () => this.moveLeft());
                this.input.keyboard.on('keydown-RIGHT', () => this.moveRight());
                
                this.input.on('pointerdown', (p) => {
                    if (p.x < width/2) this.moveLeft(); else this.moveRight();
                });

                updateStatus("System Live.");
            }

            drawRoad() {
                const g = this.roadGraphics;
                g.clear();
                // Dark road surface
                g.fillStyle(0x0a0a0a, 1);
                g.fillRect(0, 0, this.gameWidth, this.gameHeight);
                
                // Outer glow
                g.lineStyle(2, 0x00f2ff, 0.2);
                g.strokeRect(2, 0, this.gameWidth - 4, this.gameHeight);
            }

            getLaneX(lane) { 
                return (lane * this.laneWidth) + (this.laneWidth / 2); 
            }

            update(time, delta) {
                if (this.isGameOver) return;

                // Move road lines
                this.roadLines.getChildren().forEach(c => {
                    c.y += this.speed * (delta / 1000);
                    if (c.y > this.gameHeight + 100) {
                        c.y = -100;
                    }
                });

                // Spawn logic
                if (time > (this.lastSpawn || 0) + 1200) {
                    this.spawnObstacle();
                    this.lastSpawn = time;
                }

                this.score += delta * 0.01;
                this.updateScoreCallback(Math.floor(this.score));
                this.updateSpeedCallback(Math.floor(this.speed * 0.2));
            }

            spawnObstacle() {
                const lane = Phaser.Math.Between(0, 2);
                const laneX = this.getLaneX(lane);
                
                const hasCar = this.assetStatus['car'];
                const key = hasCar ? 'car' : 'car_fallback';
                
                const obs = this.add.sprite(laneX, -150, key);
                
                if (key === 'car') {
                    const targetWidth = this.laneWidth * 0.7;
                    obs.setScale(targetWidth / obs.width);
                } else {
                    obs.setDisplaySize(this.laneWidth * 0.6, 100);
                }
                
                this.obstacles.add(obs);
                if (obs.body) {
                    obs.body.setVelocityY(this.speed);
                }
            }

            handleCollision() {
                if (this.isGameOver || this.isInvincible) return;
                console.log("💥 Collision Detected!");
                this.physics.pause();
                this.isGameOver = true;
                this.gameOverCallback(true);
            }

            moveLeft() { 
                if (this.currentLane > 0 && !this.isGameOver) { 
                    this.currentLane--; 
                    this.updatePos(); 
                } 
            }
            
            moveRight() { 
                if (this.currentLane < 2 && !this.isGameOver) { 
                    this.currentLane++; 
                    this.updatePos(); 
                } 
            }

            updatePos() {
                this.tweens.add({ 
                    targets: this.player, 
                    x: this.getLaneX(this.currentLane), 
                    duration: 150, 
                    ease: 'Power2' 
                });
            }

            resetGame() {
                console.log("🏁 Resetting Game...");
                this.isGameOver = false;
                this.score = 0;
                this.obstacles.clear(true, true);
                this.physics.resume();
                this.player.setX(this.getLaneX(1));
                this.player.setAlpha(1);
                this.isInvincible = false;
                this.currentLane = 1;
            }

            revive() {
                console.log("❤️ Reviving...");
                this.isGameOver = false;
                this.physics.resume();
                this.isInvincible = true;
                this.player.setAlpha(1);
                
                // Clear immediate obstacles
                this.obstacles.getChildren().forEach(o => {
                    if (o.y > 0) o.destroy();
                });

                this.tweens.add({ 
                    targets: this.player, 
                    alpha: 0.3, 
                    duration: 150, 
                    yoyo: true, 
                    repeat: 10, 
                    onComplete: () => { 
                        this.isInvincible = false; 
                        this.player.setAlpha(1); 
                    } 
                });
            }
        }

        // --- REACT UI ---
        const App = () => {
            const [score, setScore] = useState(0);
            const [speed, setSpeed] = useState(0);
            const [isGameOver, setIsGameOver] = useState(false);
            const [hasStarted, setHasStarted] = useState(false);
            const [canRevive, setCanRevive] = useState(true);
            const [countdown, setCountdown] = useState(5);
            const [showRevive, setShowRevive] = useState(false);
            
            const gameRef = useRef(null);
            const sceneRef = useRef(null);

            useEffect(() => {
                updateStatus("⚛️ Initializing UI components...");
                const config = {
                    type: Phaser.AUTO, width: 400, height: 600,
                    parent: 'game-mount',
                    physics: { default: 'arcade' },
                    scene: new MainScene({
                        onUpdateScore: (s) => setScore(s),
                        onUpdateSpeed: (v) => setSpeed(v),
                        onGameOver: (g) => setIsGameOver(g)
                    }),
                    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
                };
                gameRef.current = new Phaser.Game(config);
                const timer = setInterval(() => {
                    const scene = gameRef.current.scene.getScene('MainScene');
                    if (scene) { sceneRef.current = scene; clearInterval(timer); }
                }, 100);
                return () => { clearInterval(timer); gameRef.current.destroy(true); };
            }, []);

            useEffect(() => {
                if (isGameOver && score > 0 && canRevive) {
                    setShowRevive(true); setCountdown(5);
                }
            }, [isGameOver]);

            useEffect(() => {
                let t;
                if (showRevive && countdown > 0) {
                    t = setTimeout(() => setCountdown(c => c - 1), 1000);
                } else if (showRevive && countdown === 0) {
                    setShowRevive(false);
                }
                return () => clearTimeout(t);
            }, [showRevive, countdown]);

            const start = () => {
                setHasStarted(true); setIsGameOver(false); setScore(0); setCanRevive(true);
                if(sceneRef.current) sceneRef.current.resetGame();
            };

            return (
                <div className="min-h-screen bg-black flex items-center justify-center p-4">
                    <div className="relative w-full max-w-[400px] aspect-[2/3] bg-black rounded-[32px] overflow-hidden shadow-2xl border border-white/10">
                        <div id="game-mount" className="w-full h-full" />

                        {hasStarted && !isGameOver && !showRevive && (
                            <div className="absolute top-6 left-6 right-6 flex justify-between pointer-events-none">
                                <div className="glass px-4 py-2 rounded-xl"><p className="text-[8px] text-white/40 uppercase font-bold">Speed</p><p className="text-lg font-black">{speed}</p></div>
                                <div className="glass px-4 py-2 rounded-xl text-right"><p className="text-[8px] text-white/40 uppercase font-bold">Distance</p><p className="text-lg font-black text-cyan-400">{score}m</p></div>
                            </div>
                        )}

                        <AnimatePresence>
                            {!hasStarted && (
                                <motion.div initial={{opacity:0}} animate={{opacity:1}} className="absolute inset-0 z-20 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                                    <div className="glass p-10 rounded-[32px] text-center w-full">
                                        <h1 className="text-3xl font-black italic uppercase mb-8">Neon Rider</h1>
                                        <button onClick={start} className="w-full py-4 bg-cyan-500 text-black font-bold rounded-xl uppercase tracking-tighter">Enter Void</button>
                                    </div>
                                </motion.div>
                            )}
                            
                            {showRevive && (
                                <motion.div initial={{scale:0.9, opacity:0}} animate={{scale:1, opacity:1}} className="absolute inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
                                    <div className="glass p-10 rounded-[32px] text-center w-full">
                                        <h2 className="text-2xl font-black mb-4">Revive?</h2>
                                        <div className="text-6xl font-black text-cyan-500 mb-8">{countdown}</div>
                                        <button onClick={() => { setCanRevive(false); setShowRevive(false); setIsGameOver(false); sceneRef.current.revive(); }} className="w-full py-4 bg-cyan-500 text-black font-bold rounded-xl uppercase">Revive Now</button>
                                        <button onClick={() => setShowRevive(false)} className="mt-4 text-xs text-white/40 uppercase">Skip</button>
                                    </div>
                                </motion.div>
                            )}

                            {isGameOver && !showRevive && hasStarted && (
                                <motion.div initial={{opacity:0}} animate={{opacity:1}} className="absolute inset-0 z-20 flex items-center justify-center bg-red-950/40 backdrop-blur-md p-4">
                                    <div className="glass p-10 rounded-[32px] text-center w-full border-red-500/20">
                                        <h2 className="text-4xl font-black text-red-500 mb-8 italic">WRECKED</h2>
                                        <p className="text-3xl font-black text-white mb-2">{score}m</p>
                                        <button onClick={start} className="w-full py-4 bg-white text-black font-bold rounded-xl uppercase mb-3">Retry</button>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
