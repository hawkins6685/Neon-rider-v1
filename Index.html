<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rider Standalone</title>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        /* Scanline effect */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hud-text {
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // --- LUCIDE ICONS ADAPTER ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    lucide.createIcons({
                        attrs: {
                            stroke: 'currentColor',
                            'stroke-width': 2,
                        },
                        nameMap: {
                            [name]: iconRef.current
                        }
                    });
                }
            }, [name]);

            // Simplified: Just use SVGs for reliability in standalone
            const icons = {
                Trophy: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
                Coins: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18.1"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/><path d="m17.41 17.41.71.71-2.82 2.83"/></svg>,
                ShoppingBag: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
                X: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
                Check: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
                Volume2: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
                VolumeX: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 5 6 9H2v6h4l5 4V5Z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>,
                Share2: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>,
                ArrowLeft: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
                ArrowRight: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            };
            return icons[name] || <span />;
        };

        // --- PHASER GAME LOGIC ---
        class MainScene extends Phaser.Scene {
            constructor(callbacks) {
                super('MainScene');
                this.updateScoreCallback = callbacks.onUpdateScore;
                this.updateSpeedCallback = callbacks.onUpdateSpeed;
                this.gameOverCallback = callbacks.onGameOver;
                
                this.player = null;
                this.score = 0;
                this.coinsCollected = 0;
                this.isGameOver = true;
                this.speed = 400;
                this.MAX_SPEED = 1200;
                this.spawnRate = 1500;
                this.lastSpawnTime = 0;
                this.lastCoinSpawnTime = 0;
                this.lastResetTime = 0;
                this.lastMoveTime = 0;
                this.MOVE_COOLDOWN = 200;
                this.currentLane = 1;
                this.bikeColor = 0x00f2ff;
                this.isInvincible = false;
            }

            preload() {
                this.load.image('bike', 'https://i.postimg.cc/hv0ZQZtc/motorcycle-black.png');
                this.load.image('obstacle-car', 'https://i.postimg.cc/tJrGP4B3/car-green-2.png');
                this.load.image('obstacle-truck', 'https://i.postimg.cc/2jH5nkb7/car-red-small-4.png');
                this.load.image('obstacle-cone', 'https://i.postimg.cc/BvV0X6wv/cone-straight.png');
                this.load.image('obstacle-barrel', 'https://i.postimg.cc/gjb1Z6yN/barrel-red-down.png');

                const graphics = this.make.graphics({ x: 0, y: 0 });
                graphics.fillStyle(0xffffff);
                graphics.fillCircle(4, 4, 4);
                graphics.generateTexture('trail', 8, 8);
                graphics.destroy();
            }

            create() {
                const { width, height } = this.scale;
                this.gameWidth = width;
                this.gameHeight = height;
                this.laneWidth = width / 3;

                this.add.rectangle(width / 2, height / 2, width, height, 0x010c1c); 
                for (let i = 0; i < 40; i++) {
                    this.add.circle(Math.random() * width, Math.random() * height * 0.4, Math.random() * 1.5, 0xffffff, Math.random() * 0.8);
                }
                
                const horizonGlow = this.add.graphics();
                horizonGlow.fillGradientStyle(0x001a33, 0x001a33, 0x1a0033, 0x1a0033, 0.6);
                horizonGlow.fillRect(0, 0, width, height * 0.35);

                this.backgroundElements = this.add.group();
                for (let i = 0; i < 15; i++) {
                    const rect = this.add.rectangle(width / 2, i * (height/10), width, 1, 0x00ffff, 0.05);
                    this.backgroundElements.add(rect);
                }

                this.roadLines = this.add.group();
                for (let i = 0; i < 10; i++) {
                    const lineY = i * (height / 5);
                    this.roadLines.add(this.add.rectangle(this.laneWidth, lineY, 2, 40, 0x00ffff, 0.2));
                    this.roadLines.add(this.add.rectangle(this.laneWidth * 2, lineY, 2, 40, 0x00ffff, 0.2));
                }

                this.player = this.add.sprite(this.getLaneX(this.currentLane), height - 100, 'bike');
                this.player.setScale(45 / this.player.width);
                this.player.setTint(this.bikeColor);

                this.headlight = this.add.graphics();
                this.headlight.setBlendMode(Phaser.BlendModes.ADD);

                this.trailEmitter = this.add.particles(0, 0, 'trail', {
                    speed: 100, scale: { start: 1, end: 0 }, alpha: { start: 0.5, end: 0 },
                    blendMode: 'ADD', follow: this.player, followOffset: { x: 0, y: 30 },
                    lifespan: 400, frequency: 20, tint: this.bikeColor
                });

                this.sparkEmitter = this.add.particles(0, 0, 'trail', {
                    speed: { min: 50, max: 150 }, angle: { min: 80, max: 100 },
                    scale: { start: 0.4, end: 0 }, alpha: { start: 1, end: 0 },
                    blendMode: 'ADD', follow: this.player, followOffset: { x: 0, y: 25 },
                    lifespan: 300, gravityY: 200, frequency: 50, tint: this.bikeColor
                });

                this.physics.add.existing(this.player);
                if (this.player.body instanceof Phaser.Physics.Arcade.Body) {
                    this.player.body.setCollideWorldBounds(true);
                    this.player.body.setSize(this.player.width * 0.5, this.player.height * 0.8);
                    this.player.body.setOffset((this.player.width - this.player.body.width) / 2, (this.player.height - this.player.body.height) * 0.6);
                }

                this.obstacles = this.physics.add.group();
                this.coins = this.physics.add.group();

                this.physics.add.overlap(this.player, this.obstacles, this.handleCollision, undefined, this);

                // Controls
                this.input.keyboard.on('keydown-LEFT', () => this.moveLeft());
                this.input.keyboard.on('keydown-RIGHT', () => this.moveRight());
                
                let startX = 0;
                this.input.on('pointerdown', (p) => { startX = p.x; });
                this.input.on('pointerup', (p) => {
                    if (Math.abs(p.x - startX) > 30) {
                        if (p.x > startX) this.moveRight(); else this.moveLeft();
                    } else {
                        if (p.x < this.gameWidth / 2) this.moveLeft(); else this.moveRight();
                    }
                });
            }

            getLaneX(lane) { return (lane * this.laneWidth) + (this.laneWidth / 2); }

            update(time, delta) {
                if (this.isGameOver) { this.headlight.clear(); return; }

                if (this.headlight && this.player && this.player.visible) {
                    this.headlight.clear();
                    const flicker = Math.random() > 0.98 ? 0.4 : 1.0;
                    const pulse = 0.8 + Math.sin(time / 100) * 0.1;
                    const alpha = (0.2 + (Math.sin(time / 50) * 0.05)) * flicker * pulse;
                    const px = this.player.x;
                    const py = this.player.y - 30;
                    const angle = Phaser.Math.DegToRad(this.player.angle - 90);
                    
                    for (let i = 0; i < 3; i++) {
                        const lA = alpha / (i + 1);
                        const lLen = 250 * (1 - i * 0.2);
                        const lSpr = 0.35 * (1 + i * 0.5);
                        this.headlight.lineStyle(0, 0xffffff, 0);
                        this.headlight.fillStyle(0xffffff, lA);
                        this.headlight.beginPath();
                        this.headlight.moveTo(px, py);
                        this.headlight.lineTo(px + Math.cos(angle - lSpr) * lLen, py + Math.sin(angle - lSpr) * lLen);
                        this.headlight.lineTo(px + Math.cos(angle + lSpr) * lLen, py + Math.sin(angle + lSpr) * lLen);
                        this.headlight.closePath();
                        this.headlight.fillPath();
                    }
                }

                this.backgroundElements.getChildren().forEach(c => {
                    c.y += (this.speed * 0.2) * (delta / 1000);
                    if (c.y > this.gameHeight) c.y = 0;
                });
                this.roadLines.getChildren().forEach(c => {
                    c.y += this.speed * (delta / 1000);
                    if (c.y > this.gameHeight) c.y = -20;
                });

                if (time > this.lastSpawnTime + this.spawnRate) {
                    this.spawnObstacle();
                    this.lastSpawnTime = time;
                    const diff = Math.min(1, this.score / 5000);
                    this.speed = 400 + (800 * diff);
                    this.spawnRate = 1500 - (1100 * diff);
                }

                this.score += delta * 0.01;
                this.updateScoreCallback(Math.floor(this.score));
                this.updateSpeedCallback(Math.floor(this.speed * 0.2));
            }

            spawnObstacle() {
                const lane = Phaser.Math.Between(0, 2);
                const types = ['obstacle-car', 'obstacle-truck', 'obstacle-cone', 'obstacle-barrel'];
                const key = Phaser.Utils.Array.GetRandom(types);
                const obs = this.add.sprite(this.getLaneX(lane), -100, key);
                obs.setScale(75 / obs.width);
                this.obstacles.add(obs);
                if (obs.body instanceof Phaser.Physics.Arcade.Body) {
                    obs.body.setVelocityY(this.speed);
                }
            }

            handleCollision() {
                if (this.isGameOver || this.isInvincible) return;
                this.physics.pause();
                this.cameras.main.shake(200, 0.05);
                this.isGameOver = true;
                this.gameOverCallback(true);
            }

            moveLeft() { if (this.currentLane > 0) { this.currentLane--; this.updatePos(); } }
            moveRight() { if (this.currentLane < 2) { this.currentLane++; this.updatePos(); } }
            updatePos() {
                this.tweens.add({ targets: this.player, x: this.getLaneX(this.currentLane), duration: 200, ease: 'Cubic.easeOut' });
            }

            resetGame() {
                this.isGameOver = false;
                this.score = 0;
                this.speed = 400;
                this.currentLane = 1;
                this.obstacles.clear(true, true);
                this.physics.resume();
                this.player.setX(this.getLaneX(1));
                this.player.setVisible(true);
                this.isInvincible = false;
            }

            revive() {
                this.isGameOver = false;
                this.physics.resume();
                this.isInvincible = true;
                this.player.setVisible(true);
                this.tweens.add({ targets: this.player, alpha: 0.3, duration: 150, yoyo: true, repeat: 10, onComplete: () => { this.isInvincible = false; this.player.setAlpha(1); } });
            }
        }

        const App = () => {
            const containerRef = useRef(null);
            const gameRef = useRef(null);
            const sceneRef = useRef(null);

            const [score, setScore] = useState(0);
            const [speed, setSpeed] = useState(0);
            const [isGameOver, setIsGameOver] = useState(false);
            const [hasStarted, setHasStarted] = useState(false);
            const [canRevive, setCanRevive] = useState(true);
            const [reviveCountdown, setReviveCountdown] = useState(5);
            const [showReviveConfirm, setShowReviveConfirm] = useState(false);

            useEffect(() => {
                const config = {
                    type: Phaser.AUTO, width: 400, height: 600,
                    parent: containerRef.current,
                    physics: { default: 'arcade', arcade: { gravity: { x: 0, y: 0 } } },
                    scene: new MainScene({
                        onUpdateScore: (s) => setScore(s),
                        onUpdateSpeed: (v) => setSpeed(v),
                        onGameOver: (g) => setIsGameOver(g)
                    }),
                    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
                };
                const game = new Phaser.Game(config);
                gameRef.current = game;
                const check = setInterval(() => {
                    const scene = game.scene.getScene('MainScene');
                    if (scene) { sceneRef.current = scene; clearInterval(check); }
                }, 100);
                return () => { clearInterval(check); game.destroy(true); };
            }, []);

            useEffect(() => {
                if (isGameOver && score > 0 && canRevive) {
                    setShowReviveConfirm(true);
                    setReviveCountdown(5);
                }
            }, [isGameOver]);

            useEffect(() => {
                let timer;
                if (showReviveConfirm && reviveCountdown > 0) {
                    timer = setInterval(() => setReviveCountdown(p => p - 1), 1000);
                } else if (showReviveConfirm && reviveCountdown === 0) {
                    setShowReviveConfirm(false);
                }
                return () => clearInterval(timer);
            }, [showReviveConfirm, reviveCountdown]);

            const startGame = () => {
                setHasStarted(true); setIsGameOver(false); setScore(0); setCanRevive(true);
                if (sceneRef.current) sceneRef.current.resetGame();
            };

            const handleRevive = () => {
                setCanRevive(false); setShowReviveConfirm(false); setIsGameOver(false);
                if (sceneRef.current) sceneRef.current.revive();
            };

            return (
                <div className="min-h-screen bg-[#050505] flex flex-col items-center justify-center p-4">
                    <div className="relative w-full max-w-[400px] aspect-[2/3] bg-black rounded-[32px] overflow-hidden shadow-2xl border border-white/5">
                        <div ref={containerRef} className="w-full h-full" />

                        {hasStarted && !isGameOver && !showReviveConfirm && (
                            <div className="absolute top-6 left-6 right-6 flex justify-between pointer-events-none">
                                <div className="glass px-5 py-2 rounded-2xl hud-text">
                                    <p className="text-[10px] uppercase tracking-widest text-white/50 font-bold">Velocity</p>
                                    <p className="text-2xl font-black">{speed} <span className="text-xs opacity-50">km/h</span></p>
                                </div>
                                <div className="glass px-5 py-2 rounded-2xl hud-text text-right">
                                    <p className="text-[10px] uppercase tracking-widest text-white/50 font-bold">Distance</p>
                                    <p className="text-2xl font-black text-cyan-400">{score} <span className="text-xs opacity-50">m</span></p>
                                </div>
                            </div>
                        )}

                        <AnimatePresence>
                            {!hasStarted && (
                                <motion.div className="absolute inset-0 z-20 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                                    <div className="glass p-10 rounded-[32px] text-center w-full max-w-[320px]">
                                        <h1 className="text-4xl font-black italic uppercase mb-2">Neon Rider</h1>
                                        <p className="text-white/60 text-[10px] uppercase tracking-widest font-bold mb-8 italic text-cyan-500">Standalone Edition</p>
                                        <button onClick={startGame} className="w-full py-4 bg-cyan-500 text-black font-bold rounded-xl text-xl uppercase tracking-tighter shadow-lg shadow-cyan-500/20">Start Engine</button>
                                    </div>
                                </motion.div>
                            )}

                            {showReviveConfirm && (
                                <motion.div className="absolute inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
                                    <div className="glass p-10 rounded-[32px] text-center w-full max-w-[320px]">
                                        <h2 className="text-3xl font-black italic mb-6">Revive?</h2>
                                        <div className="text-6xl font-black text-cyan-500 mb-8">{reviveCountdown}</div>
                                        <button onClick={handleRevive} className="w-full py-4 bg-cyan-500 text-black font-bold rounded-xl text-lg uppercase tracking-tighter shadow-lg shadow-cyan-500/30">Revive Now</button>
                                        <button onClick={() => setShowReviveConfirm(false)} className="mt-4 text-white/40 uppercase tracking-widest text-[10px] font-bold">Skip</button>
                                    </div>
                                </motion.div>
                            )}

                            {isGameOver && !showReviveConfirm && hasStarted && (
                                <motion.div className="absolute inset-0 z-20 flex items-center justify-center bg-red-950/40 backdrop-blur-md p-4">
                                    <div className="glass p-10 rounded-[32px] text-center w-full max-w-[320px] border-red-500/20">
                                        <h2 className="text-5xl font-black italic uppercase mb-2 text-red-500">Wrecked</h2>
                                        <p className="text-5xl font-black text-white mb-8">{score}<span className="text-xl opacity-40">m</span></p>
                                        <button onClick={startGame} className="w-full py-4 bg-white text-black font-bold rounded-xl text-xl uppercase tracking-tighter">Retry</button>
                                        <button onClick={() => { const text = `I just rode ${score}m in Neon Rider!`; navigator.clipboard.writeText(text); alert('Score copied!'); }} className="mt-4 w-full py-2 bg-white/5 rounded-xl text-xs uppercase tracking-widest font-bold">Share Score</button>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </div>
                    <p className="mt-8 text-[10px] text-white/20 font-bold tracking-[0.4em]">NEON RIDER // STANDALONE // {new Date().getFullYear()}</p>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
